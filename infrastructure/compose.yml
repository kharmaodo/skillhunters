# Local development only. All exposed ports are bound to loopback.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: skillhunters
      POSTGRES_USER: skillhunters
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init_local.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhunters -d skillhunters"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: skillhunters
      KC_DB_PASSWORD: ${DB_PASSWORD:?Run init_local.py}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run init_local.py}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./generated/skillhunters-realm.json:/opt/keycloak/data/import/skillhunters-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
  s3:
    build:
      context: ./s3
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run init_local.py --upgrade-storage}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run init_local.py --upgrade-storage}
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["quarantine-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
  clamav:
    image: clamav/clamav:1.5.3
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      # Recover if FreshClam finishes before clamd can receive its notification.
      CLAMD_CONF_SelfCheck: "60"
    volumes: ["clamav-signatures:/var/lib/clamav"]
    networks: [analysis, signature-updates]
    # Signature reloads briefly retain both engines; 2 GiB can kill clamd.
    mem_limit: 4g
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
  document-worker:
    build:
      context: ..
      dockerfile: services/document-worker/Dockerfile
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Run init_local.py --upgrade-analysis}
      CLAMD_HOST: clamav
    ports: ["127.0.0.1:8090:8090"]
    networks: [analysis]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 32
    depends_on:
      clamav: {condition: service_started}
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      ANALYSIS_ENABLED: "true"
      WORKER_ENDPOINT: http://document-worker:8090/analyze
      WORKER_TOKEN: ${WORKER_TOKEN:?Run init_local.py --upgrade-analysis}
      DB_URL: jdbc:postgresql://postgres:5432/skillhunters
      DB_USER: skillhunters
      DB_PASSWORD: ${DB_PASSWORD:?Run init_local.py}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run init_local.py}
      OIDC_ISSUER: http://localhost:8081/realms/skillhunters
      OIDC_BACKCHANNEL: http://keycloak:8080/realms/skillhunters
      APP_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run init_local.py --upgrade-storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run init_local.py --upgrade-storage}
      S3_CREATE_BUCKET: "true"
    networks: [default, analysis]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      s3: {condition: service_healthy}
      document-worker: {condition: service_started}
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
  seed:
    profiles: [app]
    image: postgres:17.6
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Run init_local.py}
    entrypoint: ["psql", "-h", "postgres", "-U", "skillhunters", "-d", "skillhunters", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    volumes: ["./demo-seed.sql:/seed.sql:ro"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  quarantine-data:

  clamav-signatures:
networks:
  analysis:
    internal: true
  signature-updates:
