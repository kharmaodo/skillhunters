# Local development only. All exposed ports are bound to loopback.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: skillhunters
      POSTGRES_USER: skillhunters
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init_local.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhunters -d skillhunters"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: skillhunters
      KC_DB_PASSWORD: ${DB_PASSWORD:?Run init_local.py}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run init_local.py}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./generated/skillhunters-realm.json:/opt/keycloak/data/import/skillhunters-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/skillhunters
      DB_USER: skillhunters
      DB_PASSWORD: ${DB_PASSWORD:?Run init_local.py}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run init_local.py}
      OIDC_ISSUER: http://localhost:8081/realms/skillhunters
      OIDC_BACKCHANNEL: http://keycloak:8080/realms/skillhunters
      APP_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
  seed:
    profiles: [app]
    image: postgres:17.6
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Run init_local.py}
    entrypoint: ["psql", "-h", "postgres", "-U", "skillhunters", "-d", "skillhunters", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    volumes: ["./demo-seed.sql:/seed.sql:ro"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
